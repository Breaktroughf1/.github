name: Dart package CI
on:
  workflow_call:
    inputs:
      flutter:
        type: boolean
        default: true
      package-path:
        type: string
        default: "."
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.package-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: ${{ inputs.flutter }}
        with:
          channel: stable
          cache: true
      - uses: dart-lang/setup-dart@v1
        if: ${{ !inputs.flutter }}
      - run: ${{ inputs.flutter && 'flutter' || 'dart' }} pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: ${{ inputs.flutter && 'flutter analyze' || 'dart analyze --fatal-infos' }}
      - run: ${{ inputs.flutter && 'flutter test' || 'dart test' }}
      - run: dart pub publish --dry-run
      - name: pub.dev score preview (pana)
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 20 .
