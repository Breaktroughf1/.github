name: Publish to pub.dev
on:
  workflow_call:
    inputs:
      flutter:
        type: boolean
        default: true
      package-path:
        type: string
        default: "."
      environment:
        type: string
        default: "pub.dev"
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.package-path }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1   # sets up pub.dev OIDC credentials
      - uses: subosito/flutter-action@v2
        if: ${{ inputs.flutter }}
        with:
          channel: stable
          cache: true
      - run: ${{ inputs.flutter && 'flutter' || 'dart' }} pub get
      - name: Check tag matches pubspec version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG="${GITHUB_REF_NAME##*-v}"; TAG="${TAG#v}"
          echo "pubspec=$VERSION tag=$TAG"
          test "$VERSION" = "$TAG"
      - run: dart pub publish --force
